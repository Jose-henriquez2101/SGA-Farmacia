<!-- The Modal -->
<div
  class="modal"
  [ngStyle]="{ display: modalAddService.oculto }"
  tabindex="-1"
  role="dialog"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <!-- Modal Header -->
      <div class="modal-header">
        <h4 class="modal-title">
          {{ isEditing ? 'Editar Producto' : 'Crear Producto' }}
        </h4>
      </div>

      <!-- Modal body -->
      <div class="modal-body">
        <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="codigo" class="form-label">Código</label>
            <input
              type="number"
              class="form-control"
              id="codigo"
              formControlName="codigo"
              required
              min="1"
            />
          </div>

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del Producto</label>
            <input
              type="text"
              class="form-control"
              id="nombre"
              formControlName="nombre"
              required
            />
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea
              class="form-control"
              id="descripcion"
              formControlName="descripcion"
              rows="3"
              required
            ></textarea>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="precio" class="form-label">Precio</label>
              <input
                type="number"
                step="0.01"
                class="form-control"
                id="precio"
                formControlName="precio"
                required
                min="0.01"
              />
            </div>
            <div class="col-md-6">
              <label for="stock" class="form-label">Stock</label>
              <input
                type="number"
                class="form-control"
                id="stock"
                formControlName="stock"
                required
                min="1"
              />
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="stockmin" class="form-label">Stock Mínimo</label>
              <input
                type="number"
                class="form-control"
                id="stockmin"
                formControlName="stockmin"
                required
                min="0"
              />
            </div>

            <div class="col-md-6">
              <label for="categoriaId" class="form-label">Categoría</label>
              <select
                class="form-select"
                id="categoriaId"
                formControlName="categoriaId"
                required
              >
                <option value="">Seleccione una categoría</option>
                <option
                  *ngFor="let category of categories"
                  [value]="category.id"
                >
                  {{ category.nombre }}
                </option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="image" class="form-label">Imagen (URL)</label>
            <input
              type="text"
              class="form-control"
              id="image"
              formControlName="image"
            />
            <small class="text-muted">Ejemplo: assets/productos/cafe.jpg</small>
          </div>

          <div class="modal-footer">
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="productForm.invalid"
            >
              Guardar
            </button>
            <button
              (click)="ocultarModalAdd()"
              type="button"
              class="btn btn-danger"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
