<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coffe & Click</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="d-flex" id="wrapper">
      <!-- Sidebar -->
      <div
        class="bg-light border-end"
        id="sidebar-wrapper"
        style="min-width: 250px"
      >
        <div class="sidebar-heading p-3">
          <div class="user-panel d-flex align-items-center">
            <div class="image me-2">
              <img
                width="60"
                alt="ACME Logo"
                class="rounded-circle"
                src="assets/logogps.png"
              />
            </div>
            <div>
              <p class="mb-0 fw-bold">SGA Farmacia</p>
            </div>
          </div>
        </div>

        <!-- Menu -->
        <div class="list-group list-group-flush">
          <a
            [routerLink]="['product/product-list']"
            class="list-group-item list-group-item-action bg-light"
          >
            <i class="fas fa-home me-2"></i> Home
          </a>

          <a
            class="list-group-item list-group-item-action bg-light"
            data-bs-toggle="collapse"
            href="#productos"
            role="button"
          >
            <i class="fa fa-th-large me-2"></i> Productos
          </a>
          <div class="collapse ps-3" id="productos">
            <app-category-sidebar
              (categorySelected)="onCategorySelected($event)"
            ></app-category-sidebar>
          </div>

          <a
            [routerLink]="['carrito/carrito-listar']"
            class="list-group-item list-group-item-action bg-light"
            role="button"
          >
            <i class="fas fa-shopping-cart me-2"></i> Ver Carrito
          </a>
        </div>
      </div>
      <!-- /#sidebar-wrapper -->

      <!-- Page Content -->
      <div id="page-content-wrapper" class="flex-grow-1">
        <!-- HEADER -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
          <div class="container-fluid">
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarOptions"
              aria-controls="navbarOptions"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarOptions">
              <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                  <a class="nav-link fw-bold" [routerLink]="['/dashboard']">
                    <i class="fas fa-tachometer-alt me-1"></i> Dashboard
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link fw-bold" [routerLink]="['/pacientes']">
                    <i class="fas fa-user-injured me-1"></i> Pacientes
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link fw-bold" [routerLink]="['usuarios']">
                    <i class="fas fa-users me-1"></i> Usuarios
                  </a>
                </li>
                <li class="nav-item">
                  <a class="nav-link fw-bold" [routerLink]="['/stock']">
                    <i class="fas fa-boxes me-1"></i> Stock
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="container-fluid mt-3">
          <router-outlet></router-outlet>
        </div>
      </div>
      <!-- /#page-content-wrapper -->
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
